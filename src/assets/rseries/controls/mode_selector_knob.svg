<?xml version="1.0" encoding="UTF-8"?>
<!-- R Series control part — Mode Selector: KNOB.
     Industrial Design Pass 2 (Controls Library) — FINAL fidelity pass (v1.2).
     Master space (0 0 1440 1120); viewBox cropped for standalone review.
     Reproduces locked master layer 13_ModeSelector_Knob EXACTLY.
     Approved knob style: black, recessed, diagonal grip, white indicator insert.
       - static body: base ring r=82 (#161616) + deeper satin dome r=77 (radial
         #545454 -> #2c2c2c -> #101010) + a recessed inner shadow ring (depth) +
         soft upper sheen + centre cap.
       - rotating group (#mode_selector_knob_grip): a LIGHTER molded satin-gray
         finger grip (#8f8f8f -> #565656, 20x84) + a BOLD white pointer (12x66).
         Shown UNROTATED; React rotates ONLY this group by the knob angle.
     FROZEN after this pass. Satin molded plastic, neutral CAD lighting. -->
<svg viewBox="980 438 420 224" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ms-knob" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#545454"/>
      <stop offset="0.5" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#101010"/>
    </radialGradient>
    <linearGradient id="ms-knobgrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8f8f"/>
      <stop offset="1" stop-color="#565656"/>
    </linearGradient>
  </defs>
  <g id="mode_selector_knob">
    <!-- static recessed body -->
    <circle cx="1210" cy="556" r="82" fill="#161616"/>
    <circle cx="1210" cy="556" r="77" fill="url(#ms-knob)" stroke="#0b0b0b" stroke-width="2"/>
    <circle cx="1210" cy="556" r="75" fill="none" stroke="#000000" stroke-opacity="0.30" stroke-width="3"/>
    <ellipse cx="1194" cy="528" rx="44" ry="28" fill="#ffffff" opacity="0.16"/>
    <!-- rotating molded grip + bold white pointer (React rotates this group only) -->
    <g id="mode_selector_knob_grip">
      <rect x="1200" y="548" width="20" height="84" rx="10" fill="url(#ms-knobgrip)" stroke="#3a3a3a" stroke-width="0.75"/>
      <rect x="1204" y="564" width="12" height="70" rx="6" fill="#f4f6f8"/>
    </g>
    <circle cx="1210" cy="556" r="10" fill="#232323" stroke="#3a3a3a"/>
  </g>
</svg>
